name: Deploy Edge Function

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Секреты функции (ключи VK Cloud и т. п.) задаются один раз в панели Supabase — здесь не нужны.
      - name: Deploy
        run: supabase functions deploy uploads --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt --use-api

      - name: Health check
        run: curl -fsS "https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1/uploads/health"
